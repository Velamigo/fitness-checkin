<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健身打卡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0a0e1a;--card:#131826;--border:#1e2a44;--accent:#6c5ce7;
    --text:#e3e6f0;--dim:#8892b0;--green:#00d68f;--red:#ff6b6b;
    --gold:#ffd700;--blue:#3b82f6;--input-bg:#0d1117;
  }
  [data-theme="light"]{
    --bg:#f0f2f5;--card:#ffffff;--border:#d0d5dd;--accent:#6c5ce7;
    --text:#1a1a2e;--dim:#667085;--green:#009a6b;--red:#e63946;
    --gold:#b8860b;--blue:#2563eb;--input-bg:#f8f9fa;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:.3s;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
  .header h1{font-size:18px;font-weight:700;}
  .icon-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .icon-btn:hover{border-color:var(--accent);background:var(--accent);color:#fff;}
  .page{max-width:800px;margin:0 auto;padding:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;}
  .card h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .input-group{margin-bottom:14px;}
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:15px;outline:none;transition:.2s;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.15);}
  .btn{padding:12px 24px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-size:15px;font-weight:600;transition:.2s;}
  .btn:hover{opacity:.85;}
  .btn.green{background:var(--green);color:#000;}
  .empty{text-align:center;color:var(--dim);padding:40px;font-size:14px;}
  /* ===== 健身打卡 ===== */
  .fit-cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .fit-cat-btn{padding:14px 8px;border:2px solid var(--border);border-radius:12px;background:var(--input-bg);color:var(--text);cursor:pointer;font-size:14px;font-weight:600;transition:.2s;text-align:center;}
  .fit-cat-btn:hover{border-color:var(--accent);}
  .fit-cat-btn.selected{border-color:var(--accent);background:var(--accent);color:#fff;}
  .fit-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .fit-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
  .fit-stat-num{font-size:28px;font-weight:800;}
  .fit-stat-label{font-size:12px;color:var(--dim);margin-top:4px;}
  .fit-chart{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .fit-bar-row{display:flex;align-items:center;gap:10px;}
  .fit-bar-label{width:80px;font-size:13px;color:var(--dim);text-align:right;flex-shrink:0;}
  .fit-bar-track{flex:1;height:28px;background:var(--input-bg);border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .fit-bar-fill{height:100%;border-radius:8px;min-width:4px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px;font-weight:700;color:#fff;}
  .fit-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;}
  .fit-cal-day{text-align:center;padding:10px 4px;border-radius:8px;font-size:12px;border:1px solid var(--border);background:var(--input-bg);}
  .fit-cal-day.done{background:var(--green);color:#000;border-color:var(--green);font-weight:700;}
  .fit-cal-day.today{border-color:var(--accent);border-width:2px;}
  .fit-cal-day .cal-date{font-size:14px;font-weight:700;}
  .fit-cal-day .cal-weekday{font-size:10px;color:var(--dim);}
  .fit-cal-day.done .cal-weekday{color:#000;opacity:.7;}
  /* ===== 打卡记录表格 ===== */
  .fit-tbl-wrap{overflow-x:auto;margin-top:8px;}
  .fit-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
  .fit-tbl thead th{position:sticky;top:0;background:var(--card);border-bottom:2px solid var(--border);padding:10px 8px;text-align:center;font-size:12px;color:var(--dim);white-space:nowrap;}
  .fit-tbl tbody td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;}
  .fit-tbl tbody tr:hover{background:var(--input-bg);}
  .fit-tbl .td-cat{font-weight:600;}
  .fit-tbl .td-del{cursor:pointer;color:var(--red);border:none;background:none;font-size:14px;padding:4px 8px;border-radius:6px;}
  .fit-tbl .td-del:hover{background:rgba(255,107,107,.15);}
  /* ===== 年度统计 ===== */
  .fit-year-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .fit-year-chip{padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--input-bg);text-align:center;}
  .fit-year-chip .yr-num{font-size:20px;font-weight:800;color:var(--accent);}
  .fit-year-chip .yr-label{font-size:11px;color:var(--dim);}
  /* ===== 日期/年月周 输入行 ===== */
  .fit-date-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
  .fit-date-row .input-group{margin-bottom:0;}
  .fit-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:12px 24px;border-radius:12px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:fitToastIn .3s ease;}
  @keyframes fitToastIn{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  @media(max-width:600px){
    .page{padding:12px;}
    .card{padding:16px;border-radius:12px;}
    .card h2{font-size:16px;}
    input{font-size:16px;padding:10px 12px;}
    label{font-size:12px;}
    .btn{padding:10px 20px;font-size:14px;width:100%;}
    .fit-stats{grid-template-columns:repeat(2,1fr);}
    .fit-cat-grid{grid-template-columns:repeat(2,1fr);}
    .fit-stat-num{font-size:24px;}
    .fit-date-row{grid-template-columns:1fr 1fr;}
    .fit-tbl{font-size:12px;min-width:500px;}
  }
</style>
</head>
<body>
<div class="header">
  <h1>💪 健身打卡</h1>
  <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</div>

<div class="page">
  <div class="fit-stats" id="fitStats"></div>

  <div class="card">
    <h2>💪 打卡</h2>
    <label>选择锻炼部位</label>
    <div class="fit-cat-grid" id="fitCatGrid"></div>
    <div class="fit-date-row" style="margin-top:12px">
      <div class="input-group">
        <label>日期</label>
        <input type="date" id="fitDate" />
      </div>
      <div class="input-group">
        <label>年度</label>
        <input type="number" id="fitYear" placeholder="自动" />
      </div>
      <div class="input-group">
        <label>月</label>
        <input type="number" id="fitMonth" placeholder="自动" min="1" max="12" />
      </div>
      <div class="input-group">
        <label>周别</label>
        <input type="number" id="fitWeek" placeholder="自动" min="1" max="53" />
      </div>
    </div>
    <div class="input-group" style="margin-top:12px">
      <label>上次锻炼项目（可选）</label>
      <input type="text" id="fitNote" placeholder="如：上次锻炼了胸">
    </div>
    <button class="btn green" onclick="fitCheckin()" style="margin-top:8px">✅ 立即打卡</button>
  </div>

  <div class="card">
    <h2>📊 各部位锻炼次数</h2>
    <div class="fit-chart" id="fitChart"></div>
  </div>

  <div class="card">
    <h2>📅 最近 7 天</h2>
    <div class="fit-cal" id="fitCal"></div>
  </div>

  <div class="card">
    <h2>📈 按年度统计</h2>
    <div class="fit-year-grid" id="fitYearStats"></div>
  </div>

  <div class="card">
    <h2>📋 打卡记录</h2>
    <div class="fit-tbl-wrap">
      <table class="fit-tbl" id="fitRecords">
        <thead><tr>
          <th>日期</th><th>部位</th><th>年度</th><th>月</th><th>周别</th><th>上次锻炼项目</th><th>删除</th>
        </tr></thead>
        <tbody id="fitRecordsBody"></tbody>
      </table>
    </div>
    <div id="fitEmpty" class="empty" style="display:none">暂无打卡记录</div>
  </div>
</div>

<script>
// ===== Supabase (native fetch, no SDK) =====
const SB_URL='https://kpxfhrqkkhdetjmyhjqj.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtweGZocnFra2hkZXRqbXloanFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Mzg0MTMsImV4cCI6MjEwMjQxNDQxM30.w0Rqr7x1SYgzfi0YeJCtaRW_EcigUB0ALEj9N-7p1zU';

// ===== Theme =====
let theme=localStorage.getItem('theme')||'dark';
function applyTheme(){
  if(theme==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('themeBtn').textContent=theme==='dark'?'🌙':'☀️';
}
function toggleTheme(){
  theme=theme==='dark'?'light':'dark';
  localStorage.setItem('theme',theme);
  applyTheme();
}

// ===== 工具 =====
const $=id=>document.getElementById(id);

// ===== 健身打卡 =====
const FIT_CATS=['胸','背','腿','核心','臀/腿','体能','手臂','全身综合/恢复运动'];
const FIT_COLORS=['#6c5ce7','#00d68f','#3b82f6','#ffd700','#ff9f43','#ff6b6b','#a29bfe','#00cec9'];
let fitData=[];
let fitSelectedCat='';

async function fitFetch(method,path,body){
  const headers={
    'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'
  };
  const opts={method,headers};
  if(body)opts.body=JSON.stringify(body);
  if(method==='POST'||method==='DELETE')headers['Prefer']='return=minimal';
  const url=SB_URL+'/rest/v1/checkins'+path;
  const res=await fetch(url,opts);
  if(method==='GET'&&res.ok)return res.json();
  return res.ok;
}

async function fitLoad(){
  try{
    fitData=await fitFetch('GET','?select=id,date,category,year,month,week,prev_category,note&order=date.desc,created_at.desc');
  }catch(e){console.warn('fitLoad error:',e);fitData=[];}
  if(!Array.isArray(fitData))fitData=[];
  fitRenderStats();
  fitRenderChart();
  fitRenderCal();
  fitRenderYearStats();
  fitRenderRecords();
}

function getISOWeek(date){
  const d=new Date(date);
  d.setHours(0,0,0,0);
  const day=(d.getDay()+6)%7; // Mon=0..Sun=6
  const thursday=new Date(d);
  thursday.setDate(d.getDate()+(3-day));
  const jan1=new Date(thursday.getFullYear(),0,1);
  const diff=(thursday-jan1)/(86400000);
  return 1+Math.ceil((diff+jan1.getDay()+1)/7);
}

function fitRenderStats(){
  const today=new Date();
  const todayStr=today.toISOString().slice(0,10);
  const total=fitData.length;
  
  // This month
  const ym=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  const monthCount=fitData.filter(r=>r.date&&r.date.startsWith(ym)).length;
  
  // This week (Mon-Sun)
  const dayOfWeek=today.getDay()||7; // 1=Mon..7=Sun
  const monday=new Date(today);
  monday.setDate(today.getDate()-(dayOfWeek-1));
  monday.setHours(0,0,0,0);
  const sunday=new Date(monday);
  sunday.setDate(monday.getDate()+6);
  sunday.setHours(23,59,59,999);
  const weekCount=fitData.filter(r=>{
    if(!r.date)return false;
    const d=new Date(r.date+'T00:00:00');
    return d>=monday&&d<=sunday;
  }).length;
  
  // Streak
  const dates=new Set(fitData.filter(r=>r.date).map(r=>r.date));
  let streak=0;
  const checkDate=new Date(today);
  if(!dates.has(checkDate.toISOString().slice(0,10))){
    checkDate.setDate(checkDate.getDate()-1);
  }
  while(dates.has(checkDate.toISOString().slice(0,10))){
    streak++;
    checkDate.setDate(checkDate.getDate()-1);
  }
  
  $('fitStats').innerHTML=`
    <div class="fit-stat"><div class="fit-stat-num" style="color:var(--accent)">${total}</div><div class="fit-stat-label">总打卡次数</div></div>
    <div class="fit-stat"><div class="fit-stat-num" style="color:var(--green)">${monthCount}</div><div class="fit-stat-label">本月打卡</div></div>
    <div class="fit-stat"><div class="fit-stat-num" style="color:var(--blue)">${weekCount}</div><div class="fit-stat-label">本周打卡</div></div>
    <div class="fit-stat"><div class="fit-stat-num" style="color:var(--gold)">🔥${streak}</div><div class="fit-stat-label">连续打卡天数</div></div>
  `;
}

function fitRenderChart(){
  const counts={};
  FIT_CATS.forEach(c=>counts[c]=0);
  fitData.forEach(r=>{
    if(r.category&&counts[r.category]!==undefined)counts[r.category]++;
  });
  fitData.forEach(r=>{
    if(r.category&&!FIT_CATS.includes(r.category)){
      counts[r.category]=(counts[r.category]||0)+1;
    }
  });
  const max=Math.max(...Object.values(counts),1);
  
  let html='';
  const sortedAll=Object.entries(counts).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(sortedAll.length===0){
    html='<div class="empty">暂无数据</div>';
  }else{
    sortedAll.forEach(([cat,count])=>{
      const idx=FIT_CATS.indexOf(cat);
      const color=idx>=0?FIT_COLORS[idx]:'#6c5ce7';
      const pct=(count/max*100).toFixed(1);
      html+=`<div class="fit-bar-row">
        <div class="fit-bar-label">${cat}</div>
        <div class="fit-bar-track"><div class="fit-bar-fill" style="width:${pct}%;background:${color}">${count}</div></div>
      </div>`;
    });
  }
  $('fitChart').innerHTML=html;
}

function fitRenderCal(){
  const today=new Date();
  const dates=new Set(fitData.filter(r=>r.date).map(r=>r.date));
  const todayStr=today.toISOString().slice(0,10);
  const weekdays=['日','一','二','三','四','五','六'];
  let html='';
  for(let i=6;i>=0;i--){
    const d=new Date(today);
    d.setDate(today.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const done=dates.has(ds);
    const isToday=ds===todayStr;
    html+=`<div class="fit-cal-day ${done?'done':''} ${isToday?'today':''}">
      <div class="cal-date">${d.getDate()}</div>
      <div class="cal-weekday">${weekdays[d.getDay()]}</div>
    </div>`;
  }
  $('fitCal').innerHTML=html;
}

function fitRenderYearStats(){
  const counts={};
  fitData.forEach(r=>{
    if(r.year)counts[r.year]=(counts[r.year]||0)+1;
  });
  const years=Object.keys(counts).sort();
  let html='';
  if(years.length===0){
    html='<div class="empty">暂无数据</div>';
  }else{
    years.forEach(y=>{
      html+=`<div class="fit-year-chip"><div class="yr-num">${counts[y]}</div><div class="yr-label">${y}年</div></div>`;
    });
  }
  $('fitYearStats').innerHTML=html;
}

function fitRenderRecords(){
  const body=$('fitRecordsBody');
  const empty=$('fitEmpty');
  if(!fitData.length){empty.style.display='block';body.innerHTML='';return;}
  empty.style.display='none';
  let html='';
  fitData.forEach(r=>{
    const idx=FIT_CATS.indexOf(r.category);
    const color=r.category&&idx>=0?FIT_COLORS[idx]:'var(--dim)';
    const catDisplay=r.category||'—';
    const yr=r.year||'—';
    const mo=r.month!=null?r.month:'—';
    const wk=r.week!=null?r.week:'—';
    const prev=r.prev_category||'—';
    html+=`<tr>
      <td>${r.date||'—'}</td>
      <td class="td-cat" style="color:${color}">${catDisplay}</td>
      <td>${yr}</td>
      <td>${mo}</td>
      <td>${wk}</td>
      <td>${prev}</td>
      <td><button class="td-del" onclick="fitDel(${r.id})">✕</button></td>
    </tr>`;
  });
  body.innerHTML=html;
}

function fitSelectCat(cat,btn){
  fitSelectedCat=cat;
  document.querySelectorAll('.fit-cat-btn').forEach(b=>b.classList.remove('selected'));
  if(btn)btn.classList.add('selected');
}

async function fitCheckin(){
  if(!fitSelectedCat){alert('请先选择锻炼部位');return;}
  const note=$('fitNote').value.trim();
  // Use selected date, or default to today
  let dateVal=$('fitDate').value;
  if(!dateVal){
    dateVal=new Date().toISOString().slice(0,10);
  }
  // Auto-calc year/month/week if not provided
  const d=new Date(dateVal+'T00:00:00');
  let year=$('fitYear').value?parseInt($('fitYear').value):d.getFullYear();
  let month=$('fitMonth').value?parseInt($('fitMonth').value):(d.getMonth()+1);
  let week=$('fitWeek').value?parseInt($('fitWeek').value):getISOWeek(d);

  const payload={
    date:dateVal,
    category:fitSelectedCat,
    year:year,
    month:month,
    week:week,
    prev_category:note||'',
    note:''
  };
  const ok=await fitFetch('POST','',payload);
  if(ok){
    fitToast('打卡成功！💪');
    $('fitNote').value='';
    $('fitDate').value='';
    $('fitYear').value='';
    $('fitMonth').value='';
    $('fitWeek').value='';
    await fitLoad();
  }else{
    alert('打卡失败，请重试');
  }
}

async function fitDel(id){
  if(!confirm('确定删除这条打卡记录？'))return;
  const ok=await fitFetch('DELETE','?id=eq.'+id);
  if(ok){
    await fitLoad();
  }else{
    alert('删除失败，请重试');
  }
}

function fitToast(msg){
  const t=document.createElement('div');
  t.className='fit-toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

// Render category buttons
function fitRenderCats(){
  const grid=$('fitCatGrid');
  let html='';
  FIT_CATS.forEach((cat,i)=>{
    html+=`<button class="fit-cat-btn" data-cat="${i}" onclick="fitSelectCat(FIT_CATS[${i}],this)">${cat}</button>`;
  });
  grid.innerHTML=html;
}

// ===== 初始化 =====
applyTheme();
fitRenderCats();
fitLoad();
</script>
</body>
</html>
